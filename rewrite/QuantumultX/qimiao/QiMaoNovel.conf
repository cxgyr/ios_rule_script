# 七猫小说 · 广告接口重写
# 用途：Quantumult X 重写规则，配合 [rewrite_remote] 订阅
# 来源：fmz200/wool_scripts、GrandpaNiuu/GrandpaNiu
# 整理日期：2026-09-14
#
# 说明：七猫主域 wtzw.com 的内容接口与广告接口同域，
#      所以只能做 URL 路径级 reject，不能整域 block。
#      B 组为第三方广告 SDK，基本无副作用；
#      C 组为七猫自家运营接口，效果最明显但可能误伤福利功能。

# ---- B 组：第三方广告 SDK，安全 ----
^https?:\/\/open\.e\.kuaishou\.cn\/rest\/e\/v3\/open\/univ url reject
^https?:\/\/api-access\.pangolin-sdk-toutiao-b\.com\/api\/ad\/union\/sdk\/get_ads url reject
^https?:\/\/api-access\.(pangolin-sdk-toutiao|pangolin-sdk-toutiao1)\.com\/api\/ad url reject
^https?:\/\/lf\-cdn\-tos\.bytescm\.com\/obj\/static\/ad url reject
^https?:\/\/sf3\-fe\-tos\.pglstatp\-toutiao\.com\/obj\/ad\-pattern\/ url reject
^https?:\/\/dsp\-x\.jd\.com\/adx\/sdk url reject
^https?:\/\/p1\-lm\.adukwai\.com\/bs2\/adUnionVideo url reject

# ---- C 组：七猫自家广告与运营接口 ----
^https?:\/\/api\-cfg\.wtzw\.com\/v\d\/splash\/ url reject-dict
^https?:\/\/api\-cfg\.wtzw\.com\/v1\/(adv|reward|operation) url reject
^https?:\/\/api\-cfg\.wtzw\.com\/v\d\/offline\-adv\/index url reject-dict
^https?:\/\/api\-cfg\.wtzw\.com\/v\d\/operation\/index\?ad_personal_switch url reject-dict
^https?:\/\/api\-bc\.wtzw\.com\/api\/v4\/search\/dispose url reject-dict
^https?:\/\/api\-bc\.wtzw\.com\/api\/v\d\/book\-store\/(config|push\-book) url reject-dict
^https?:\/\/api\-bc\.wtzw\.com\/api\/v\d\/operation url reject-dict
^https?:\/\/cdn\.wtzw\.com\/bookimg\/free\/api\/v\d\/reader\/reader\-copy\-paragraph\-all\.json url reject-dict

# 下面两条是红包/提现类引流入口。拦掉之后金币任务相关页面可能显示异常，
# 如果你在跑金币任务，把这两行删掉或注释掉。
^https?:\/\/api\-gw\.wtzw\.com\/welf\/app\/v\d\/task\/red\-packet url reject-dict
^https?:\/\/xiaoshuo\.wtzw\.com\/api\/v\d\/withdraw\/init url reject-dict

# MITM 域名。QX 会读取远程重写资源里的 hostname 行并合并到 MITM 列表；
# 如果你的 QX 版本没生效，把这串域名手动加到本地 [mitm] 的 hostname 后面。
hostname = api-cfg.wtzw.com, api-bc.wtzw.com, api-gw.wtzw.com, cdn.wtzw.com, xiaoshuo.wtzw.com, open.e.kuaishou.cn, api-access.pangolin-sdk-toutiao-b.com, api-access.pangolin-sdk-toutiao.com, api-access.pangolin-sdk-toutiao1.com, dsp-x.jd.com, p1-lm.adukwai.com, lf-cdn-tos.bytescm.com, sf3-fe-tos.pglstatp-toutiao.com
